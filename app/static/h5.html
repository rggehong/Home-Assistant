<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef3ec">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>清风 H5 · 家庭空调</title>
    <link rel="stylesheet" href="/static/h5.css?v=13">
  </head>
  <body>
    <main class="app-shell">
      <header class="mobile-header">
        <div>
          <p id="today">家庭气候</p>
          <h1>清风</h1>
        </div>
        <div class="header-actions">
          <button id="syncButton" class="round-button" aria-label="刷新">↻</button>
          <button id="authButton" class="avatar-button" aria-label="家庭账户">家</button>
        </div>
      </header>

      <div class="status-line" id="statusLine"><i></i><span>正在连接本地空调</span></div>
      <nav class="room-tabs" id="roomTabs" aria-label="选择房间"></nav>

      <section id="controlView">
        <article class="climate-card" id="climateCard">
          <div class="card-topline">
            <div>
              <span class="micro-label">当前房间</span>
              <h2 id="roomName">—</h2>
            </div>
            <button id="powerButton" class="power-button" aria-label="开关空调">◉</button>
          </div>

          <div class="thermostat">
            <div
              class="temperature-ring"
              id="temperatureRing"
              role="slider"
              tabindex="0"
              aria-label="设定温度，沿圆环拖动调整"
              aria-valuemin="16"
              aria-valuemax="30"
              aria-valuestep="0.5"
              aria-valuenow="26"
            >
              <div class="ring-inner">
                <span class="micro-label" aria-hidden="true"></span>
                <div><strong id="targetTemperature">—</strong><sup>°C</sup></div>
                <span class="room-temperature" id="roomTemperature">室温 —</span>
              </div>
              <span class="dial-handle" id="dialHandle" aria-hidden="true"></span>
            </div>
            <button id="tempDown" class="temp-button" aria-label="降低温度">−</button>
            <button id="tempUp" class="temp-button" aria-label="升高温度">＋</button>
          </div>

          <div class="mode-strip" id="modeStrip">
            <button data-mode="auto">自动</button>
            <button data-mode="cool">制冷</button>
            <button data-mode="dry">除湿</button>
            <button data-mode="fan">送风</button>
            <button data-mode="heat">制热</button>
          </div>
        </article>

        <section class="control-panel">
          <div class="section-title">
            <div><span class="micro-label">精细调节</span><h3>风向与舒适模式</h3></div>
            <span id="deviceIp">—</span>
          </div>

          <div class="select-grid">
            <label>
              <span>风速</span>
              <select id="fanSelect">
                <option value="auto">自动风</option>
                <option value="low">低风</option>
                <option value="medium_low">中低风</option>
                <option value="medium">中风</option>
                <option value="medium_high">中高风</option>
                <option value="high">高风</option>
              </select>
            </label>
            <label>
              <span>上下风向</span>
              <select id="verticalSelect"></select>
            </label>
            <label id="horizontalField">
              <span>左右风向</span>
              <select id="horizontalSelect"></select>
            </label>
          </div>

          <div class="switch-grid">
            <label class="switch-card" id="sleepCard">
              <span><strong>睡眠模式</strong><small>夜间柔和运行</small></span>
              <input type="checkbox" id="sleepSwitch"><i></i>
            </label>
            <label class="switch-card" id="lightCard">
              <span><strong>面板灯</strong><small>空调显示灯光</small></span>
              <input type="checkbox" id="lightSwitch"><i></i>
            </label>
            <label class="switch-card" id="quietCard">
              <span><strong>静音</strong><small>降低运行噪声</small></span>
              <input type="checkbox" id="quietSwitch"><i></i>
            </label>
            <label class="switch-card" id="lowerOutletCard" hidden>
              <span><strong>下出风</strong><small>独立下部出风口</small></span>
              <input type="checkbox" id="lowerOutletSwitch"><i></i>
            </label>
            <label class="switch-card" id="antiDirectCard" hidden>
              <span><strong>防直吹</strong><small>风口向上避人</small></span>
              <input type="checkbox" id="antiDirectSwitch"><i></i>
            </label>
            <label class="switch-card" id="turboCard" hidden>
              <span><strong>强劲风</strong><small>快速强力送风</small></span>
              <input type="checkbox" id="turboSwitch"><i></i>
            </label>
            <label class="switch-card" id="healthCard" hidden>
              <span><strong>健康</strong><small>开启健康净化</small></span>
              <input type="checkbox" id="healthSwitch"><i></i>
            </label>
            <label class="switch-card" id="auxiliaryHeatCard" hidden>
              <span><strong>辅热</strong><small>电辅热增强制热</small></span>
              <input type="checkbox" id="auxiliaryHeatSwitch"><i></i>
            </label>
          </div>

        </section>
      </section>

      <section class="tv-view" id="tvView">
        <article class="tv-card remote-stage">
          <div class="tv-remote">
            <header class="remote-header">
              <div>
                <span class="remote-brand">SONY</span>
                <strong id="tvName">索尼电视</strong>
              </div>
              <button id="tvPowerButton" class="remote-key remote-power" aria-label="开关电视">⏻</button>
            </header>
            <p class="tv-status" id="tvStatus">正在读取电视状态</p>

            <div class="remote-row remote-row-three">
              <button class="remote-key" data-tv-remote="tv"><b>电视</b></button>
              <span class="remote-sensor" aria-hidden="true"></span>
              <button class="remote-key remote-icon" data-tv-remote="settings" aria-label="电视设置">⚙</button>
            </div>

            <div class="remote-row remote-row-sides">
              <button class="remote-key" data-tv-remote="input"><b>输入</b></button>
              <i class="remote-led" aria-hidden="true"></i>
              <button class="remote-key" data-tv-remote="options"><b>选项</b></button>
            </div>

            <div class="remote-dpad" aria-label="电视方向控制">
              <button class="remote-direction remote-up" data-tv-remote="up" aria-label="向上">▲</button>
              <button class="remote-direction remote-left" data-tv-remote="left" aria-label="向左">◀</button>
              <button class="remote-ok" data-tv-remote="confirm">OK</button>
              <button class="remote-direction remote-right" data-tv-remote="right" aria-label="向右">▶</button>
              <button class="remote-direction remote-down" data-tv-remote="down" aria-label="向下">▼</button>
            </div>

            <div class="remote-row remote-row-sides">
              <button class="remote-key remote-back" data-tv-remote="back" aria-label="返回"></button>
              <span></span>
              <button class="remote-key remote-icon" data-tv-remote="home" aria-label="主页">⌂</button>
            </div>

            <div class="remote-row remote-row-three">
              <button class="remote-key" data-tv-remote="mute"><b>静音</b></button>
              <button class="remote-key remote-voice" disabled title="网页遥控暂不支持语音输入"><b>话筒</b></button>
              <button class="remote-key remote-icon" data-tv-remote="menu" aria-label="菜单">☰</button>
            </div>

            <div class="remote-volume-rocker" aria-label="电视音量">
              <button data-tv-remote="volume_up" aria-label="提高电视音量">＋</button>
              <span>VOL</span>
              <button data-tv-remote="volume_down" aria-label="降低电视音量">−</button>
            </div>

            <label class="tv-input-field">
              <span>直接切换信号源</span>
              <select id="tvInputSelect"></select>
            </label>
          </div>
        </article>
      </section>

      <section class="schedule-panel" id="scheduleView">
        <div class="section-title">
          <div><span class="micro-label">自动执行</span><h3>定时开关机</h3></div>
          <span>服务器执行</span>
        </div>
        <form id="scheduleForm">
          <div class="schedule-fields">
            <label>
              <span>控制设备</span>
              <select id="scheduleTarget"></select>
            </label>
            <label>
              <span>执行操作</span>
              <select id="scheduleAction">
                <option value="off">定时关机</option>
                <option value="on">定时开机</option>
              </select>
            </label>
            <label>
              <span>执行时间</span>
              <input id="scheduleTime" type="datetime-local" required>
            </label>
          </div>
          <button class="secondary-button" type="submit">添加定时任务</button>
        </form>
        <div class="schedule-list" id="scheduleList"></div>
      </section>

      <nav class="view-nav" aria-label="页面功能">
        <button class="active" data-view="control">格力空调</button>
        <button data-view="tv">索尼电视</button>
        <button data-view="schedule">定时任务</button>
      </nav>
    </main>

    <dialog id="authDialog">
      <form id="authForm">
        <button type="button" class="dialog-close" id="closeDialog">×</button>
        <span class="micro-label">安全访问</span>
        <h3>登录清风家庭</h3>
        <p>输入一次家庭访问密码，此设备将安全保持登录 30 天。</p>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="家庭访问密码" required>
        <button class="primary-button" type="submit">登录</button>
        <button class="secondary-button" type="button" id="logoutButton" hidden>退出此设备</button>
        <p class="error-text" id="authError"></p>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script src="/static/h5.js?v=13" defer></script>
  </body>
</html>
