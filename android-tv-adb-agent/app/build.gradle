apply plugin: 'com.android.application'

android {
    namespace 'cn.gezhixin.smarthome.tvagent'
    compileSdk 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'cn.gezhixin.smarthome.tvagent'
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
